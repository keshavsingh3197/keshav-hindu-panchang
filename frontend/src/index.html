  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      background: #fffbf5;
      color: #431407;
      font-family: 'Yantramanav', 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: opacity 0.22s ease;
    }
    #boot-loader.hidden { opacity: 0; pointer-events: none; }
    #boot-loader .boot-badge {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ea580c 0%, #9a3412 100%);
      color: #fef08a;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(154, 52, 18, 0.28);
    }
    #boot-loader .boot-ring {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 3px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      animation: boot-spin 0.75s linear infinite;
    }
    #boot-loader p {
      margin: 0;
      font-size: 0.92rem;
      color: #78350f;
      font-weight: 600;
      text-align: center;
      padding: 0 1rem;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
